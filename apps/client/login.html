<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CodeSync - Join the jam</title>
<script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{colors:{ink:'#171522',cream:'#fff8e8',pink:'#ff5c8a',yellow:'#ffd447',aqua:'#42e8d4',purple:'#7357ff'},fontFamily:{display:['Bowlby One SC','sans-serif'],body:['DM Sans','sans-serif'],mono:['Space Mono','monospace']},boxShadow:{pop:'6px 6px 0 #171522',popSmall:'3px 3px 0 #171522'}}}};</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;background:#ff5c8a;color:#171522}.dots{background-image:radial-gradient(#171522 1.5px,transparent 1.5px);background-size:18px 18px}.wiggle{animation:wiggle 4s ease-in-out infinite}@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-5px)}}input:focus{outline:3px solid #42e8d4;outline-offset:2px}</style>
</head><body><div id="root"></div><script src="https://unpkg.com/react@18/umd/react.development.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const{useState}=React;
function Login(){const[mode,setMode]=useState('login'),[username,setUsername]=useState(''),[password,setPassword]=useState(''),[error,setError]=useState(''),[busy,setBusy]=useState(false);async function submit(event){event.preventDefault();if(!username.trim()||!password)return setError('Isi nama dan password dulu, ya.');setBusy(true);setError('');try{const response=await fetch(`http://localhost:3000/api/${mode}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.trim(),password})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Coba lagi sebentar.');if(mode==='login'){sessionStorage.setItem('username',username.trim());window.location.href='index.html'}else{setMode('login');setPassword('');setError('Akun jadi! Sekarang masuk ke studio.')}}catch(err){setError(err.message==='Failed to fetch'?'Server belum menyala. Jalankan node server.js.':err.message)}finally{setBusy(false)}}return <main className="min-h-screen overflow-hidden bg-cream relative flex items-center justify-center p-5"><div className="absolute -right-24 -top-24 h-72 w-72 rounded-full bg-aqua border-4 border-ink dots"></div><div className="absolute -left-20 bottom-8 h-40 w-40 rounded-full bg-yellow border-4 border-ink"></div><div className="relative z-10 grid w-full max-w-5xl overflow-hidden border-4 border-ink bg-pink shadow-pop md:grid-cols-[1.1fr_.9fr]"><section className="dots min-h-[260px] p-8 md:p-12 flex flex-col justify-between"><div className="flex items-center gap-3"><div className="grid h-12 w-12 place-items-center border-3 border-ink bg-yellow text-2xl shadow-popSmall">{'{ }'}</div><span className="font-mono text-sm font-bold">CS / 2026</span></div><div><p className="font-mono mb-3 text-sm font-bold uppercase">A playground for</p><h1 className="font-display text-5xl leading-[.9] tracking-tight sm:text-7xl">CODE<br/><span className="text-cream">TOGETHER</span></h1><p className="mt-6 max-w-sm text-lg font-bold">Tulis, ngobrol, dan bikin sesuatu yang seru bareng tim kamu.</p></div><div className="wiggle mt-8 w-fit border-3 border-ink bg-aqua px-4 py-2 font-mono text-xs font-bold shadow-popSmall">NO SOLO CODING ✦</div></section><section className="bg-cream p-8 md:p-12 flex flex-col justify-center"><div className="mb-8"><p className="font-mono text-xs font-bold uppercase text-purple">{mode==='login'?'Welcome back, maker':'New crew member'}</p><h2 className="mt-2 font-display text-4xl leading-none">{mode==='login'?'LET’S JAM.':'JOIN THE JAM.'}</h2></div>{error&&<div className="mb-5 border-3 border-ink bg-yellow px-4 py-3 font-mono text-xs font-bold">{error}</div>}<form onSubmit={submit} className="space-y-5"><label className="block"><span className="font-mono text-xs font-bold uppercase">Your name</span><input value={username} onChange={e=>setUsername(e.target.value)} className="mt-2 w-full border-3 border-ink bg-white px-4 py-3 font-mono shadow-popSmall" placeholder="pixel_maker" autoFocus/></label><label className="block"><span className="font-mono text-xs font-bold uppercase">Secret phrase</span><input value={password} onChange={e=>setPassword(e.target.value)} type="password" className="mt-2 w-full border-3 border-ink bg-white px-4 py-3 font-mono shadow-popSmall" placeholder="••••••••"/></label><button disabled={busy} className="w-full border-3 border-ink bg-purple px-5 py-4 font-mono text-sm font-bold uppercase text-white shadow-pop transition-transform hover:-translate-y-1 disabled:opacity-60">{busy?'LOADING...':mode==='login'?'ENTER STUDIO →':'MAKE MY ACCOUNT →'}</button></form><button onClick={()=>{setMode(mode==='login'?'register':'login');setError('')}} className="mt-7 text-left font-mono text-xs font-bold underline decoration-2 underline-offset-4">{mode==='login'?'Belum punya akun? Daftar di sini':'Sudah punya akun? Masuk di sini'}</button></section></div></main>}
ReactDOM.createRoot(document.getElementById('root')).render(<Login/>);
</script></body></html>
